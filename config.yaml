
# AI Recognition System Configuration

# Data paths
data:
  raw_images_dir: "data/raw"
  augmented_images_dir: "data/augmented" 
  features_file: "data/features.h5"
  models_dir: "data/models"

# Model configuration
model:
  clip_variant: "ViT-B/32"
  embedding_dim: 512
  num_classes: 1000

# Training configuration  
training:
  # Model configuration
  clip_model: "ViT-B/32"
  embedding_dim: 512
  num_classes: 100  # Reduced for small dataset
  
  # Training parameters
  batch_size: 16  # Reduced for faster training
  epochs: 25     # Increased for better generalization
  learning_rate: 0.0001
  weight_decay: 0.0001
  triplet_margin: 0.5
  arcface_margin: 0.5
  save_every: 5
  checkpoint_dir: "checkpoints"
  
  # Logging
  use_wandb: false

# Augmentation configuration
augmentation:
  augmentations_per_image: 50  # Restored for 95%+ accuracy (50x factor)
  image_size: [768, 768]       # Balanced resolution for accuracy/speed
  quality: 90                  # High quality for better features

# Feature extraction configuration
features:
  feature_image_size: 512
  batch_size: 32
  # Mobile mode toggle (set to true for Surface/edge devices)
  mobile_mode: false  # Disabled for maximum accuracy on new items
  # When mobile_mode=true:
  #   - Only CLIP features extracted (skip ResNet/EfficientNet)
  #   - Smaller image size (224x224)
  #   - Skip traditional CV features
  #   - ~800x faster processing

# Recognition configuration
recognition:
  model_path: "checkpoints/best_model.pth"
  index_path: "data/models/faiss_index.bin"
  metadata_path: "data/models/metadata.pkl"
  cache_size: 1000
  confidence_threshold: 0.85
  high_confidence_threshold: 0.95
  batch_confidence_threshold: 0.90
  batch_size: 16

# Performance targets
targets:
  accuracy: 0.95
  inference_time: 0.5  # seconds
  memory_usage: 4000  # MB
